name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Lint is reported but not enforced yet: the tree carries 16 pre-existing
      # errors (mostly `any` in the store and set-state-in-effect warnings that
      # need real refactors). Enforcing it today would mean a permanently red
      # build, which teaches everyone to ignore CI. Fix those, then delete this
      # line so lint blocks like everything else.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
